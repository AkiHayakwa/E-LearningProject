<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="forgotPasswordIllustrationTitle">
  <title id="forgotPasswordIllustrationTitle">Forgot password illustration</title>
  <rect width="640" height="640" rx="48" fill="#ffffff"/>
  <rect x="32" y="32" width="576" height="576" rx="40" fill="#f4f7fb" stroke="#e4e8f4" stroke-width="2"/>
  
  <!-- Background decorative elements -->
  <circle cx="160" cy="120" r="80" fill="#e8f2ff" opacity="0.6"/>
  <circle cx="480" cy="520" r="100" fill="#fff4e6" opacity="0.5"/>
  
  <!-- Main illustration container -->
  <g transform="translate(95 80)">
    <rect x="10" y="40" width="420" height="420" rx="60" fill="#ffffff" stroke="#d5d9e5" stroke-width="4"/>
    
    <!-- Broken chain/lock icon -->
    <g transform="translate(180 120)">
      <!-- Lock body -->
      <rect x="50" y="100" width="120" height="140" rx="12" fill="#f5f5f5" stroke="#6366f1" stroke-width="4"/>
      <rect x="70" y="120" width="80" height="100" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="3"/>
      <circle cx="110" cy="180" r="25" fill="#6366f1" opacity="0.2"/>
      <circle cx="110" cy="180" r="15" fill="#ffffff"/>
      
      <!-- Broken chain links -->
      <g transform="translate(0 20)">
        <!-- Top chain link (broken) -->
        <path d="M 80 60 Q 60 40 40 60 Q 20 80 40 100" 
              fill="none" 
              stroke="#6366f1" 
              stroke-width="6" 
              stroke-linecap="round"/>
        <path d="M 120 60 Q 140 40 160 60 Q 180 80 160 100" 
              fill="none" 
              stroke="#6366f1" 
              stroke-width="6" 
              stroke-linecap="round"/>
        
        <!-- Bottom chain link -->
        <ellipse cx="110" cy="260" rx="35" ry="20" fill="none" stroke="#6366f1" stroke-width="6"/>
        <ellipse cx="110" cy="260" rx="25" ry="15" fill="#ffffff"/>
      </g>
      
      <!-- Key icon -->
      <g transform="translate(250 180)">
        <!-- Key head -->
        <circle cx="0" cy="0" r="30" fill="#fbbf24" stroke="#6366f1" stroke-width="4"/>
        <circle cx="0" cy="0" r="20" fill="#ffffff"/>
        <circle cx="-8" cy="-8" r="6" fill="#6366f1"/>
        <circle cx="8" cy="8" r="6" fill="#6366f1"/>
        
        <!-- Key shaft -->
        <rect x="-4" y="0" width="8" height="80" rx="4" fill="#fbbf24" stroke="#6366f1" stroke-width="3"/>
        
        <!-- Key teeth -->
        <rect x="-8" y="70" width="16" height="20" rx="8" fill="#fbbf24" stroke="#6366f1" stroke-width="3"/>
        <rect x="4" y="60" width="12" height="15" rx="6" fill="#fbbf24" stroke="#6366f1" stroke-width="2"/>
      </g>
    </g>
    
    <!-- Email/OTP illustration -->
    <g transform="translate(100 300)">
      <!-- Envelope -->
      <rect x="0" y="0" width="240" height="160" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="4"/>
      <path d="M 0 40 L 120 120 L 240 40" fill="#e8f2ff" stroke="#6366f1" stroke-width="3"/>
      <rect x="20" y="60" width="200" height="80" rx="8" fill="#f5f5f5"/>
      
      <!-- OTP code dots -->
      <g transform="translate(60 100)">
        <circle cx="0" cy="0" r="8" fill="#6366f1"/>
        <circle cx="30" cy="0" r="8" fill="#6366f1"/>
        <circle cx="60" cy="0" r="8" fill="#6366f1"/>
        <circle cx="90" cy="0" r="8" fill="#6366f1"/>
        <circle cx="120" cy="0" r="8" fill="#6366f1"/>
        <circle cx="150" cy="0" r="8" fill="#6366f1"/>
      </g>
    </g>
    
    <!-- Decorative elements -->
    <circle cx="50" cy="350" r="15" fill="#34d399" opacity="0.4"/>
    <circle cx="380" cy="100" r="20" fill="#f472b6" opacity="0.3"/>
    <circle cx="400" cy="380" r="12" fill="#fbbf24" opacity="0.5"/>
  </g>
</svg>





