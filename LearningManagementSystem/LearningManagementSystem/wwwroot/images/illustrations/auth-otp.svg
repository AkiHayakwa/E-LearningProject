<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="otpVerificationIllustrationTitle">
  <title id="otpVerificationIllustrationTitle">OTP verification illustration</title>
  <rect width="640" height="640" rx="48" fill="#ffffff"/>
  <rect x="32" y="32" width="576" height="576" rx="40" fill="#f4f7fb" stroke="#e4e8f4" stroke-width="2"/>
  
  <!-- Background decorative elements -->
  <circle cx="120" cy="100" r="70" fill="#e8f2ff" opacity="0.5"/>
  <circle cx="520" cy="540" r="90" fill="#fff4e6" opacity="0.4"/>
  
  <!-- Main illustration container -->
  <g transform="translate(95 80)">
    <rect x="10" y="40" width="420" height="420" rx="60" fill="#ffffff" stroke="#d5d9e5" stroke-width="4"/>
    
    <!-- Shield with checkmark icon -->
    <g transform="translate(160 100)">
      <!-- Shield body -->
      <path d="M 110 40 
               Q 110 20 130 20 
               L 190 20 
               Q 210 20 210 40 
               L 210 120 
               Q 210 180 160 220 
               Q 110 180 110 120 
               Z" 
            fill="#6366f1" 
            stroke="#4f46e5" 
            stroke-width="4"/>
      
      <!-- Shield inner highlight -->
      <path d="M 130 50 
               Q 130 40 140 40 
               L 180 40 
               Q 190 40 190 50 
               L 190 110 
               Q 190 150 160 180 
               Q 130 150 130 110 
               Z" 
            fill="#818cf8" 
            opacity="0.6"/>
      
      <!-- Checkmark -->
      <path d="M 130 120 
               L 150 140 
               L 190 100" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="8" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
    
    <!-- OTP code display -->
    <g transform="translate(120 280)">
      <!-- OTP input boxes -->
      <g transform="translate(0 0)">
        <!-- Box 1 - filled -->
        <rect x="0" y="0" width="50" height="70" rx="12" fill="#6366f1" stroke="#4f46e5" stroke-width="3"/>
        <text x="25" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
        
        <!-- Box 2 - filled -->
        <rect x="70" y="0" width="50" height="70" rx="12" fill="#6366f1" stroke="#4f46e5" stroke-width="3"/>
        <text x="95" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
        
        <!-- Box 3 - filled -->
        <rect x="140" y="0" width="50" height="70" rx="12" fill="#6366f1" stroke="#4f46e5" stroke-width="3"/>
        <text x="165" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
        
        <!-- Box 4 - empty -->
        <rect x="210" y="0" width="50" height="70" rx="12" fill="#ffffff" stroke="#d5d9e5" stroke-width="3" stroke-dasharray="4,4"/>
        
        <!-- Box 5 - empty -->
        <rect x="280" y="0" width="50" height="70" rx="12" fill="#ffffff" stroke="#d5d9e5" stroke-width="3" stroke-dasharray="4,4"/>
        
        <!-- Box 6 - empty -->
        <rect x="350" y="0" width="50" height="70" rx="12" fill="#ffffff" stroke="#d5d9e5" stroke-width="3" stroke-dasharray="4,4"/>
      </g>
      
      <!-- Cursor indicator on box 4 -->
      <g transform="translate(210 0)">
        <line x1="25" y1="75" x2="25" y2="90" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
        <circle cx="25" cy="95" r="3" fill="#6366f1"/>
      </g>
    </g>
    
    <!-- Email/Envelope illustration -->
    <g transform="translate(100 380)">
      <!-- Envelope -->
      <rect x="0" y="0" width="240" height="140" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="3"/>
      <path d="M 0 30 L 120 100 L 240 30" fill="#e8f2ff" stroke="#6366f1" stroke-width="2"/>
      
      <!-- Email content lines -->
      <line x1="30" y1="50" x2="210" y2="50" stroke="#d5d9e5" stroke-width="2" stroke-linecap="round"/>
      <line x1="30" y1="70" x2="180" y2="70" stroke="#d5d9e5" stroke-width="2" stroke-linecap="round"/>
      <line x1="30" y1="90" x2="200" y2="90" stroke="#d5d9e5" stroke-width="2" stroke-linecap="round"/>
      
      <!-- OTP text in email -->
      <text x="30" y="115" font-family="Arial, sans-serif" font-size="14" fill="#6366f1" font-weight="bold">Mã OTP: 123456</text>
    </g>
    
    <!-- Security lock icon -->
    <g transform="translate(350 200)">
      <!-- Lock body -->
      <rect x="0" y="30" width="60" height="70" rx="8" fill="#34d399" stroke="#10b981" stroke-width="3"/>
      <rect x="10" y="40" width="40" height="50" rx="6" fill="#ffffff"/>
      <circle cx="30" cy="70" r="12" fill="#10b981" opacity="0.3"/>
      <circle cx="30" cy="70" r="8" fill="#ffffff"/>
      
      <!-- Lock shackle -->
      <path d="M 30 30 
               Q 30 10 50 10 
               Q 70 10 70 30" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="4" 
            stroke-linecap="round"/>
    </g>
    
    <!-- Decorative elements -->
    <circle cx="50" cy="200" r="12" fill="#34d399" opacity="0.4"/>
    <circle cx="380" cy="100" r="15" fill="#f472b6" opacity="0.3"/>
    <circle cx="400" cy="400" r="10" fill="#fbbf24" opacity="0.5"/>
    
    <!-- Security checkmarks -->
    <g transform="translate(50 150)">
      <circle cx="0" cy="0" r="20" fill="#34d399" opacity="0.2"/>
      <path d="M -8 0 L -2 6 L 8 -4" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
    
    <g transform="translate(380 350)">
      <circle cx="0" cy="0" r="18" fill="#34d399" opacity="0.2"/>
      <path d="M -7 0 L -2 5 L 7 -4" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
  </g>
</svg>





